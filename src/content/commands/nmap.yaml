# Comandos de nmap: descubrimiento de hosts, puertos TCP y UDP, scripts NSE y salida.
tool: nmap
area: recon
url: https://nmap.org/book/man.html
commands:
  - id: nmap-host-sweep
    title: Barrido de hosts vivos en una red
    cmd: |
      sudo nmap -sn -n {{SUBNET}} -oG - | awk '/Up$/{print $2}' | tee hosts.txt
    phase: recon
    tags: [host-discovery, ping-sweep]
    notes: >-
      -sn descubre hosts sin escanear puertos. Como root manda ICMP echo, ICMP timestamp, SYN al 443
      y ACK al 80 (en tu propia red, ARP); sin root solo intenta conectar al 80 y al 443. -n evita
      resolver el DNS de cada IP.
    refs: [https://nmap.org/book/man-host-discovery.html]

  - id: nmap-host-sweep-no-icmp
    title: Descubrir hosts que no responden al ping
    cmd: |
      sudo nmap -sn -n -PE -PS21,22,80,135,443,445,3389,5985 -PA80 -PU53,161 {{SUBNET}}
    phase: recon
    tags: [host-discovery, firewall]
    notes: >-
      Si un barrido normal no encuentra nada donde debería haber equipos, el ICMP está filtrado
      (Windows lo bloquea por defecto). Un RST a la sonda SYN también delata un host vivo, aunque el
      puerto esté cerrado.
    refs: [https://nmap.org/book/man-host-discovery.html]

  - id: nmap-host-sweep-arp
    title: Barrido ARP en tu misma red con nmap
    cmd: |
      sudo nmap -sn -n -PR -e {{IFACE}} {{SUBNET}}
    phase: recon
    tags: [host-discovery, arp]
    notes: >-
      Un equipo no puede hablar en la red sin contestar a ARP, así que su firewall no lo oculta.
      Muestra también la MAC y el fabricante. No cruza routers: solo vale para tu segmento.
    refs: [https://nmap.org/book/man-host-discovery.html]

  - id: nmap-list-scan-dns
    title: Nombres DNS de una red sin tocar los hosts
    cmd: |
      nmap -sL {{SUBNET}} --dns-servers {{DC_IP}} | grep '('
    phase: recon
    tags: [host-discovery, dns]
    notes: >-
      -sL no envía nada a los hosts, solo pregunta al DNS el nombre de cada IP. En un dominio, el DNS
      del controlador suele devolver nombres que ya dicen qué es cada máquina (SQL01, WEB-DEV...).
    refs: [https://nmap.org/book/man-host-discovery.html]

  - id: nmap-tcp-all-ports
    title: Todos los puertos TCP, rápido
    cmd: |
      sudo nmap -sS -p- --open --min-rate 5000 -n -Pn {{RHOST}} -oG allports.gnmap
    phase: recon
    tags: [port-scan, tcp]
    notes: >-
      Primera pasada: solo qué puertos están abiertos, sin versiones. --min-rate 5000 va bien en un
      laboratorio; en una red real o con IDS, bájalo o quítalo, porque a esa velocidad se pierden
      puertos y salta cualquier alerta.
    refs: [https://nmap.org/book/man-port-scanning-techniques.html]

  - id: nmap-extract-ports
    title: Sacar los puertos abiertos de un escaneo
    cmd: |
      grep -oP '\d+(?=/open)' allports.gnmap | sort -un | paste -sd, -
    phase: recon
    tags: [port-scan]
    notes: >-
      Devuelve la lista separada por comas (22,80,445) que va en PORTS para la segunda pasada. Lee la
      salida grepable (-oG) de cualquier escaneo.

  - id: nmap-tcp-connect
    title: Escaneo TCP sin root o a través de un proxy
    cmd: |
      nmap -sT -Pn -n --top-ports 1000 {{RHOST}}
    phase: recon
    tags: [port-scan, tcp, proxychains]
    notes: >-
      -sT completa cada conexión con connect(), así que no necesita root y funciona detrás de
      proxychains, que no sabe reenviar paquetes SYN sueltos. A cambio, cada servicio ve y registra
      la conexión.
    refs: [https://nmap.org/book/scan-methods-connect-scan.html]

  - id: nmap-subnet-common-ports
    title: Puertos típicos en toda una red
    cmd: |
      sudo nmap -sS -n -Pn --open -p 21,22,80,135,139,443,445,1433,3389,5985,8080 {{SUBNET}} -oG subnet.gnmap
    phase: recon
    tags: [port-scan, tcp]
    notes: >-
      Con muchos hosts, primero un barrido corto de los puertos que más dan y después -p- solo contra
      los equipos interesantes. Un -p- a todo un /16 puede llevar días.

  - id: nmap-ack-firewall
    title: Mapear el firewall con un ACK scan
    cmd: |
      sudo nmap -sA -n -Pn {{RHOST}}
    phase: recon
    tags: [port-scan, firewall]
    notes: >-
      No dice si un puerto está abierto. Un RST de vuelta (unfiltered) significa que no hay filtro en
      medio; sin respuesta (filtered), que un firewall con estado descarta los paquetes que no
      pertenecen a una conexión.
    refs: [https://nmap.org/book/scan-methods-ack-scan.html]

  - id: nmap-source-port-53
    title: Comprobar si el firewall se fía del puerto de origen
    cmd: |
      sudo nmap -sS -g 53 -n -Pn {{RHOST}}
    phase: recon
    tags: [port-scan, firewall]
    notes: >-
      Algunos firewalls mal configurados dejan pasar todo lo que sale del puerto 53 (DNS) o del 88
      (Kerberos). Si con -g 53 aparecen abiertos puertos que antes salían filtered, es un hallazgo
      para el informe.
    refs: [https://nmap.org/book/man-bypass-firewalls-ids.html]

  - id: nmap-udp-top
    title: Puertos UDP más comunes
    cmd: |
      sudo nmap -sU --top-ports 100 --open -n -Pn {{RHOST}} -oN udp-top.nmap
    phase: recon
    tags: [port-scan, udp]
    notes: >-
      UDP es lento porque Linux solo manda un ICMP port unreachable por segundo y nmap tiene que
      esperarlo. 100 puertos tardan minutos; todos, horas. --open también muestra los open|filtered.
    refs: [https://nmap.org/book/scan-methods-udp-scan.html]

  - id: nmap-tcp-services
    title: Versiones y scripts por defecto en los puertos abiertos
    cmd: |
      sudo nmap -sCV -p{{PORTS}} -n -Pn {{RHOST}} -oA targeted
    phase: enum
    tags: [port-scan, tcp, nse]
    notes: >-
      Segunda pasada. -sV identifica servicio y versión y -sC lanza los scripts NSE de la categoría
      default. Solo contra los puertos abiertos tarda segundos. -oA guarda la salida normal,
      grepable y XML.
    refs: [https://nmap.org/book/man-version-detection.html]

  - id: nmap-os-detection
    title: Detección del sistema operativo
    cmd: |
      sudo nmap -O --osscan-guess -n -Pn {{RHOST}}
    phase: enum
    tags: [port-scan, os-detection]
    notes: >-
      Compara cómo responde la pila TCP/IP con su base de huellas. Necesita al menos un puerto
      abierto y uno cerrado; --osscan-guess da la coincidencia más cercana cuando no hay una exacta.
    refs: [https://nmap.org/book/man-os-detection.html]

  - id: nmap-udp-services
    title: Versiones de servicios UDP
    cmd: |
      sudo nmap -sUV -p{{PORTS}} --version-intensity 0 -n -Pn {{RHOST}}
    phase: enum
    tags: [port-scan, udp]
    notes: >-
      -sV manda payloads propios de cada protocolo: si el servicio contesta, el open|filtered pasa a
      open. --version-intensity 0 prueba solo las sondas más probables y va mucho más rápido.
    refs: [https://nmap.org/book/scan-methods-udp-scan.html]

  - id: nmap-nse-search
    title: Buscar scripts NSE
    cmd: |
      nmap --script-help 'smb-*'
    phase: enum
    tags: [nse]
    notes: >-
      Muestra las categorías y la descripción de cada script que encaja con el patrón. Están en
      /usr/share/nmap/scripts; si añades alguno, actualiza el índice con nmap --script-updatedb.
    refs: [https://nmap.org/book/nse-usage.html]

  - id: nmap-nse-vuln
    title: Buscar vulnerabilidades conocidas con NSE
    cmd: |
      sudo nmap -sV --script vuln -p{{PORTS}} -n -Pn {{RHOST}}
    phase: enum
    tags: [nse, vuln-scan]
    notes: >-
      La categoría vuln comprueba CVE concretos (MS17-010, Heartbleed...). Algunos scripts son
      intrusivos: en producción, mira antes qué lanza cada uno. Con -sV eligen mejor a qué atacar.
    refs: [https://nmap.org/nsedoc/categories/vuln.html]

  - id: nmap-nse-script-args
    title: Scripts NSE con credenciales
    cmd: |
      nmap -p445 --script smb-enum-shares,smb-enum-users --script-args smbusername={{USER}},smbpassword='{{PASS}}' {{RHOST}}
    phase: enum
    tags: [nse, smb]
    notes: >-
      --script-args pasa parámetros a los scripts, separados por comas. Con credenciales, muchos
      scripts de SMB, HTTP o bases de datos ven bastante más que de forma anónima.
    refs: [https://nmap.org/book/nse-usage.html]

  - id: nmap-output-html
    title: Informe HTML de un escaneo
    cmd: |
      xsltproc targeted.xml -o targeted.html
    phase: enum
    tags: [reporting]
    notes: >-
      La salida XML de nmap (-oX o -oA) apunta a su propia hoja de estilos; xsltproc la aplica y
      genera un informe navegable para revisar o adjuntar.
    refs: [https://nmap.org/book/output-formats-output-to-html.html]

  # ---------- Scripts por servicio (fichas de /biblia/puertos/) ----------

  - id: nmap-ftp-scripts
    title: FTP con nmap, login anónimo y sistema
    cmd: |
      nmap -p21 -sV --script "ftp-anon,ftp-syst,ftp-bounce" {{RHOST}}
    phase: enum
    tags: [ftp, nse]
    notes: >-
      ftp-anon prueba el usuario anonymous y lista lo que se ve; ftp-syst saca el sistema y la
      configuración; ftp-bounce dice si el servidor acepta PORT hacia terceros (escaneo rebotado).
    refs: [https://nmap.org/nsedoc/scripts/ftp-anon.html]

  - id: nmap-ssh-scripts
    title: SSH con nmap, algoritmos y métodos de autenticación
    cmd: |
      nmap -p22 -sV --script "ssh2-enum-algos,ssh-auth-methods,ssh-hostkey" {{RHOST}}
    phase: enum
    tags: [ssh, nse]
    notes: >-
      ssh-auth-methods dice si acepta contraseña o solo clave pública: si es solo clave, la fuerza
      bruta no tiene sentido. La huella de ssh-hostkey se repite entre máquinas clonadas.
    refs: [https://nmap.org/nsedoc/scripts/ssh-auth-methods.html]

  - id: nmap-smtp-scripts
    title: SMTP con nmap, comandos, relay y usuarios
    cmd: |
      nmap -p25,465,587 -sV --script "smtp-commands,smtp-open-relay,smtp-enum-users" {{RHOST}}
    phase: enum
    tags: [smtp, nse]
    notes: >-
      smtp-commands lista lo que anuncia EHLO (VRFY, EXPN, AUTH, STARTTLS); smtp-open-relay prueba a
      mandar correo de fuera a fuera; smtp-enum-users busca usuarios con VRFY, EXPN y RCPT TO.
    refs: [https://nmap.org/nsedoc/scripts/smtp-enum-users.html]

  - id: nmap-http-scripts
    title: Web con nmap, título, cabeceras, métodos y rutas típicas
    cmd: |
      nmap -p80,443,8080,8443 -sV --script "http-title,http-headers,http-methods,http-enum" {{RHOST}}
    phase: enum
    tags: [http, nse]
    notes: >-
      Primera foto de cada web antes de abrir el navegador. http-methods avisa de PUT o DELETE
      habilitados (WebDAV) y http-enum prueba un diccionario corto de rutas conocidas.
    refs: [https://nmap.org/nsedoc/scripts/http-enum.html]

  - id: nmap-kerberos-users
    title: Usuarios válidos del dominio por Kerberos
    cmd: |
      nmap -p88 --script krb5-enum-users --script-args krb5-enum-users.realm='{{DOMAIN}}',userdb=users.txt {{DC_IP}}
    phase: enum
    tags: [kerberos, nse, user-enum]
    notes: >-
      El KDC contesta distinto a un usuario que existe y a uno que no, sin necesidad de credenciales.
      No cuenta como intento de login fallido, pero sí deja eventos 4768 en el controlador.
    refs: [https://nmap.org/nsedoc/scripts/krb5-enum-users.html]

  - id: nmap-pop-imap-scripts
    title: POP3 e IMAP con nmap, capacidades y certificado
    cmd: |
      nmap -p110,143,993,995 -sV --script "pop3-capabilities,imap-capabilities,ssl-cert" {{RHOST}}
    phase: enum
    tags: [pop3, imap, nse]
    notes: >-
      Las capacidades dicen si acepta autenticación en claro (USER/PASS, LOGIN o PLAIN sin TLS) y el
      certificado suele llevar el nombre interno del servidor de correo.
    refs: [https://nmap.org/nsedoc/scripts/imap-capabilities.html]

  - id: nmap-rpcbind-nfs
    title: Servicios RPC y exports NFS con nmap
    cmd: |
      nmap -p111,2049 -sV --script "rpcinfo,nfs-showmount,nfs-ls" {{RHOST}}
    phase: enum
    tags: [rpcbind, nfs, nse]
    notes: >-
      rpcinfo pregunta a rpcbind qué programas RPC hay y en qué puertos (mountd, nfs, nlockmgr...).
      nfs-showmount y nfs-ls dicen qué se exporta y qué hay dentro.
    refs: [https://nmap.org/nsedoc/scripts/nfs-ls.html]

  - id: nmap-smb-security
    title: Dialectos de SMB y si exige firma
    cmd: |
      nmap -p445 --script "smb-protocols,smb2-security-mode,smb-os-discovery" {{RHOST}}
    phase: enum
    tags: [smb, nse, relay]
    notes: >-
      Si aparece SMBv1, mira EternalBlue. "Message signing enabled but not required" significa que el
      host acepta NTLM relay, y es lo normal en todo lo que no sea un controlador de dominio.
    refs: [https://nmap.org/nsedoc/scripts/smb2-security-mode.html]

  - id: nmap-smb-vuln
    title: Vulnerabilidades conocidas de SMB (EternalBlue, MS08-067...)
    cmd: |
      nmap -p445 --script "smb-vuln*" -Pn {{RHOST}}
    phase: enum
    tags: [smb, nse, vuln-scan, ms17-010]
    notes: >-
      Lanza todos los smb-vuln-*. El de MS17-010 es seguro, pero otros del patrón (ms08-067,
      regsvc-dos, cve2009-3103...) están en la categoría dos y pueden tumbar el servicio: fuera de un
      laboratorio, lanza solo el que necesites. Un State VULNERABLE en ms17-010 es SYSTEM sin credenciales.
    refs: [https://nmap.org/nsedoc/scripts/smb-vuln-ms17-010.html]

  - id: nmap-snmp-scripts
    title: SNMP con nmap, sistema, interfaces, procesos y usuarios
    cmd: |
      sudo nmap -sU -p161 --script "snmp-info,snmp-interfaces,snmp-processes,snmp-win32-users" {{RHOST}}
    phase: enum
    tags: [snmp, nse, udp]
    notes: >-
      Prueban la comunidad public por defecto (--script-args snmpcommunity=otra para cambiarla).
      snmp-win32-users devuelve las cuentas locales de un Windows.
    refs: [https://nmap.org/nsedoc/scripts/snmp-processes.html]

  - id: nmap-ldap-rootdse
    title: Dominio y nivel funcional por LDAP sin credenciales
    cmd: |
      nmap -p389 --script ldap-rootdse {{DC_IP}}
    phase: enum
    tags: [ldap, nse]
    notes: >-
      El RootDSE se lee siempre de forma anónima: da el contexto base (DC=corp,DC=local), el nombre
      DNS del controlador y el nivel funcional del dominio y del bosque.
    refs: [https://nmap.org/nsedoc/scripts/ldap-rootdse.html]

  - id: nmap-ipmi-scripts
    title: IPMI con nmap, versión y cipher 0
    cmd: |
      sudo nmap -sU -p623 --script "ipmi-version,ipmi-cipher-zero" {{RHOST}}
    phase: enum
    tags: [ipmi, nse, udp]
    notes: >-
      Con IPMI 2.0 el hash de cualquier usuario se pide sin autenticarse (RAKP). Si además acepta el
      cipher 0, vale cualquier contraseña.
    refs: [https://nmap.org/nsedoc/scripts/ipmi-cipher-zero.html]

  - id: nmap-rsync-modules
    title: Módulos de rsync
    cmd: |
      nmap -p873 --script rsync-list-modules {{RHOST}}
    phase: enum
    tags: [rsync, nse]
    notes: >-
      Cada módulo es una carpeta compartida. Los que no piden contraseña se pueden listar y
      descargar enteros con rsync.
    refs: [https://nmap.org/nsedoc/scripts/rsync-list-modules.html]

  - id: nmap-mssql-scripts
    title: MSSQL con nmap, versión, nombre del host y contraseña vacía
    cmd: |
      nmap -p1433 -sV --script "ms-sql-info,ms-sql-ntlm-info,ms-sql-empty-password" {{RHOST}}
    phase: enum
    tags: [mssql, nse]
    notes: >-
      ms-sql-ntlm-info saca el nombre del equipo y del dominio de la negociación NTLM sin
      credenciales. ms-sql-empty-password prueba sa sin contraseña.
    refs: [https://nmap.org/nsedoc/scripts/ms-sql-ntlm-info.html]

  - id: nmap-mysql-scripts
    title: MySQL con nmap, versión y root sin contraseña
    cmd: |
      nmap -p3306 -sV --script "mysql-info,mysql-empty-password" {{RHOST}}
    phase: enum
    tags: [mysql, nse]
    notes: >-
      Si contesta "Host is not allowed to connect", el servidor solo admite clientes concretos:
      habrá que llegar desde la propia máquina o desde la web que lo usa.
    refs: [https://nmap.org/nsedoc/scripts/mysql-empty-password.html]

  - id: nmap-rdp-scripts
    title: RDP con nmap, cifrado, NLA y nombre del host
    cmd: |
      nmap -p3389 --script "rdp-enum-encryption,rdp-ntlm-info" {{RHOST}}
    phase: enum
    tags: [rdp, nse]
    notes: >-
      rdp-ntlm-info da el nombre NetBIOS, el dominio y la versión exacta de Windows sin
      credenciales. Si CredSSP (NLA) no es obligatorio, se ve la pantalla de login sin autenticarse.
    refs: [https://nmap.org/nsedoc/scripts/rdp-ntlm-info.html]

  - id: nmap-vnc-scripts
    title: VNC con nmap, versión y tipos de seguridad
    cmd: |
      nmap -p5900-5910 -sV --script "vnc-info,realvnc-auth-bypass" {{RHOST}}
    phase: enum
    tags: [vnc, nse]
    notes: >-
      vnc-info lista los tipos de seguridad: None significa que se entra sin contraseña. Cada
      pantalla usa su puerto (la :0 es el 5900, la :1 el 5901...).
    refs: [https://nmap.org/nsedoc/scripts/vnc-info.html]

  - id: nmap-redis-info
    title: Redis con nmap, versión y configuración
    cmd: |
      nmap -p6379 -sV --script redis-info {{RHOST}}
    phase: enum
    tags: [redis, nse]
    notes: >-
      Si devuelve la versión, el sistema y los clientes conectados, el servidor no pide contraseña.
      Si dice NOAUTH, la tiene (requirepass).
    refs: [https://nmap.org/nsedoc/scripts/redis-info.html]

  - id: nmap-mongodb-scripts
    title: MongoDB con nmap, versión y bases de datos
    cmd: |
      nmap -p27017 -sV --script "mongodb-info,mongodb-databases" {{RHOST}}
    phase: enum
    tags: [mongodb, nse]
    notes: >-
      Si lista las bases de datos sin credenciales, la autorización está desactivada: cualquiera
      puede leer y escribir en todas.
    refs: [https://nmap.org/nsedoc/scripts/mongodb-databases.html]

  - id: nmap-docker-version
    title: API de Docker expuesta
    cmd: |
      nmap -p2375,2376 -sV --script docker-version {{RHOST}}
    phase: enum
    tags: [docker, nse]
    notes: >-
      Si el 2375 devuelve la versión, la API habla HTTP sin TLS ni autenticación: control total del
      demonio y, por extensión, del host.
    refs: [https://nmap.org/nsedoc/scripts/docker-version.html]
