# Comandos de snmpwalk (net-snmp): leer lo que expone un agente SNMP.
tool: snmpwalk
area: recon
url: https://www.net-snmp.org/docs/man/snmpwalk.html
commands:
  - id: snmpwalk-all
    title: Volcar todo lo que expone SNMP
    cmd: |
      snmpwalk -v2c -c public {{RHOST}} | tee snmp.txt
    phase: enum
    tags: [snmp]
    notes: >-
      Sistema, interfaces y sus IP (redes que no veías), tabla ARP, puertos en escucha y software
      instalado. Instala snmp-mibs-downloader y comenta mibs en /etc/snmp/snmp.conf para ver nombres
      en vez de OIDs.
    refs: [https://www.net-snmp.org/docs/man/snmpwalk.html]

  - id: snmpwalk-process-args
    title: Procesos con sus argumentos (contraseñas en la línea de comandos)
    cmd: |
      snmpwalk -v2c -c public {{RHOST}} 1.3.6.1.2.1.25.4.2.1.5
    phase: credential-access
    tags: [snmp]
    notes: >-
      hrSWRunParameters: los argumentos de cada proceso. Scripts de copia de seguridad, clientes de
      bases de datos y servicios lanzados con -p contraseña aparecen aquí en claro.
    refs: [https://www.net-snmp.org/docs/man/snmpwalk.html]

  - id: snmpwalk-windows-users
    title: Usuarios locales de un Windows por SNMP
    cmd: |
      snmpwalk -v2c -c public {{RHOST}} 1.3.6.1.4.1.77.1.2.25
    phase: enum
    tags: [snmp, windows]
    notes: >-
      La MIB de LAN Manager de Windows: cuentas locales, sin necesidad de SMB ni de credenciales. El
      OID 1.3.6.1.4.1.77.1.2.27 da los recursos compartidos.
    refs: [https://www.net-snmp.org/docs/man/snmpwalk.html]
